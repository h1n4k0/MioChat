name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag
        required: true
        default: v2.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  checks:
    if: github.repository == 'mio-qwq/MioChat' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: checks
    if: github.repository == 'mio-qwq/MioChat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require protected release control branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          test "$REF_PROTECTED" = true
          test "$(git rev-parse HEAD)" = "$DISPATCH_COMMIT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify signed tag and commit
        run: python scripts/verify_release_tag.py --tag "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Check release source
        run: python scripts/check_release.py
      - name: Build release archives
        run: python scripts/build_release.py --version "${RELEASE_TAG#v}" --output dist
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS
      - name: Sign build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/MioChat-${{ inputs.tag }}-linux-amd64.tar.gz
            dist/MioChat-${{ inputs.tag }}-linux-arm64.tar.gz
            dist/MioChat-${{ inputs.tag }}-windows-amd64.zip
            dist/MioChat-${{ inputs.tag }}-source.zip
            dist/SHA256SUMS
          create-storage-record: false
      - name: Verify provenance and prepare bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          assets=(
            "dist/MioChat-${RELEASE_TAG}-linux-amd64.tar.gz"
            "dist/MioChat-${RELEASE_TAG}-linux-arm64.tar.gz"
            "dist/MioChat-${RELEASE_TAG}-windows-amd64.zip"
            "dist/MioChat-${RELEASE_TAG}-source.zip"
            "dist/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$source_commit" \
              --deny-self-hosted-runners \
              --bundle "$PROVENANCE_BUNDLE"
          done
          cp -- "$PROVENANCE_BUNDLE" "dist/MioChat-${RELEASE_TAG}-provenance.sigstore.json"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          tmp="$(mktemp -d "$RUNNER_TEMP/miochat-release.XXXXXX")"
          trap 'case "$tmp" in "$RUNNER_TEMP"/miochat-release.*) if [[ ! -L "$tmp" ]]; then rm -rf -- "$tmp"; fi;; esac' EXIT
          assets=(
            "MioChat-${RELEASE_TAG}-linux-amd64.tar.gz"
            "MioChat-${RELEASE_TAG}-linux-arm64.tar.gz"
            "MioChat-${RELEASE_TAG}-windows-amd64.zip"
            "MioChat-${RELEASE_TAG}-source.zip"
            SHA256SUMS
            "MioChat-${RELEASE_TAG}-provenance.sigstore.json"
          )
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets > "$tmp/release.json" 2> "$tmp/error"; then
            if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                > "$tmp/lookup" 2>> "$tmp/error"; then
              echo 'Release lookup disagreed; refusing to modify it.' >&2
              exit 1
            fi
            if ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$tmp/lookup"; then
              cat "$tmp/error" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "MioChat $RELEASE_TAG" \
              --notes-file docs/RELEASE-NOTES.md
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets > "$tmp/release.json"
          fi
          expected="$(printf '%s\n' "${assets[@]}" | jq -Rn '[inputs]')"
          if ! jq -e --argjson expected "$expected" \
              '.isDraft == true and (.assets | type == "array") and
               all(.assets[]; .name as $name | ($expected | index($name)) != null) and
               ((.assets | map(.name) | length) == (.assets | map(.name) | unique | length))' \
              "$tmp/release.json" > /dev/null; then
            echo 'Release is published or has unexpected assets; refusing changes.' >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          for name in "${assets[@]}"; do
            if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$tmp/release.json" > /dev/null; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$tmp"
              if [[ "$name" == "${assets[5]}" ]]; then
                for subject in "${assets[@]:0:5}"; do
                  gh attestation verify "dist/$subject" --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                    --source-ref refs/heads/main --source-digest "$source_commit" \
                    --deny-self-hosted-runners --bundle "$tmp/$name"
                done
              elif ! cmp -- "dist/$name" "$tmp/$name"; then
                echo "Existing asset differs: $name; refusing changes." >&2
                exit 1
              fi
            fi
          done
          for name in "${assets[@]}"; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$tmp/release.json" > /dev/null; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "dist/$name"
            fi
          done
